message ImportMediaAsset {
  message Result {
    message Ok {
      oneof location {
        string managed_relative_path = 4;
        string unmanaged_absolute_path = 5;
      }

      string operation_uuid = 1;
      string reference_uuid = 2;
      string asset_uuid = 3;
    }

    oneof result {
      workspace.call.ImportMediaAsset.Result.Ok ok = 1;
      workspace.call.Error error = 2;
    }

  }

  string operation_uuid = 1;
  string reference_uuid = 2;
  string source_path = 3;
  bool force_manage_media = 4;
}

message RelinkMediaAsset {
  enum Phase {
    PHASE_UNKNOWN = 0;
    PHASE_QUEUED = 1;
    PHASE_STAGING = 2;
    PHASE_STAGED = 3;
    PHASE_PUBLISHING = 4;
    PHASE_COMPLETE = 5;
    PHASE_FAILED = 6;
  }

  message Result {
    message Ok {
      string operation_uuid = 1;
      string reference_uuid = 2;
      string asset_uuid = 3;
      workspace.call.RelinkMediaAsset.Phase phase = 4;
      uint32 attempt = 5;
      optional string failure_code = 6;
      optional string failure_detail = 7;
    }

    oneof result {
      workspace.call.RelinkMediaAsset.Result.Ok ok = 1;
      workspace.call.Error error = 2;
    }

  }

  string operation_uuid = 1;
  string reference_uuid = 2;
  string expected_asset_uuid = 3;
  string source_path = 4;
}

message MaterializeMediaAsset {
  enum Phase {
    PHASE_UNKNOWN = 0;
    PHASE_QUEUED = 1;
    PHASE_RESOLVING = 2;
    PHASE_DOWNLOADING = 3;
    PHASE_DOWNLOADED = 4;
    PHASE_VERIFYING = 5;
    PHASE_PUBLISHING = 6;
    PHASE_COMPLETE = 7;
    PHASE_FAILED = 8;
  }

  message Result {
    message Ok {
      string operation_uuid = 1;
      string reference_uuid = 2;
      string asset_uuid = 3;
      workspace.call.MaterializeMediaAsset.Phase phase = 4;
      uint32 attempt = 5;
      optional string failure_code = 6;
      optional string failure_detail = 7;
    }

    oneof result {
      workspace.call.MaterializeMediaAsset.Result.Ok ok = 1;
      workspace.call.Error error = 2;
    }

  }

  string operation_uuid = 1;
  string reference_uuid = 2;
  string expected_asset_uuid = 3;
}

