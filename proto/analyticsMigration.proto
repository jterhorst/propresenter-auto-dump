enum LegacyWorkspaceCopyMethod {
  LEGACY_WORKSPACE_COPY_METHOD_UNSPECIFIED = 0;
  LEGACY_WORKSPACE_COPY_METHOD_CLONE = 1;
  LEGACY_WORKSPACE_COPY_METHOD_COPY = 2;
  LEGACY_WORKSPACE_COPY_METHOD_LINK = 3;
  LEGACY_WORKSPACE_COPY_METHOD_IN_PLACE = 4;
}

enum LegacyWorkspaceMigrationOutcome {
  LEGACY_WORKSPACE_MIGRATION_OUTCOME_UNSPECIFIED = 0;
  LEGACY_WORKSPACE_MIGRATION_OUTCOME_SUCCEEDED = 1;
  LEGACY_WORKSPACE_MIGRATION_OUTCOME_SUCCEEDED_WITH_FAILURES = 2;
  LEGACY_WORKSPACE_MIGRATION_OUTCOME_FAILED = 3;
}

enum LegacyWorkspaceMigrationStage {
  LEGACY_WORKSPACE_MIGRATION_STAGE_UNSPECIFIED = 0;
  LEGACY_WORKSPACE_MIGRATION_STAGE_REGISTRY_IMPORT = 1;
  LEGACY_WORKSPACE_MIGRATION_STAGE_WORKSPACE_FOLDER_MISSING = 2;
  LEGACY_WORKSPACE_MIGRATION_STAGE_WORKSPACE_MOVE = 3;
