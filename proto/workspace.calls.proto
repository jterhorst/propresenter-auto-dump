}

message ImportAndAttachMedia {
  message Result {
    message Ok {
      string operation_uuid = 1;
      string reference_uuid = 2;
      string asset_uuid = 3;
      string managed_relative_path = 4;
      bytes durable_document_version_vector = 5;
    }

    oneof result {
      workspace.call.ImportAndAttachMedia.Result.Ok ok = 1;
      workspace.call.Error error = 2;
