syntax = "proto3";


package rv.data;


import "color.proto";

import "customOptions.proto";

import "uuid.proto";



message Effect {
  message EffectVariable {
    message EffectInt {
      int32 value = 1;
      int32 default_value = 2;
      int32 min = 3;
      int32 max = 4;
    }

    message EffectFloat {
      float value = 1;
      float default_value = 2;
      float min = 3;
      float max = 4;
    }

    message EffectDouble {
      double value = 1;
      double default_value = 2;
      double min = 3;
      double max = 4;
    }

    message EffectColor {
      rv.data.Color color = 1;
      rv.data.Color default_color = 2;
    }

    message EffectDirection {
      enum EffectDirection {
        EFFECT_DIRECTION_NONE = 0;
        EFFECT_DIRECTION_TOP_LEFT = 1;
        EFFECT_DIRECTION_TOP = 2;
        EFFECT_DIRECTION_TOP_RIGHT = 4;
        EFFECT_DIRECTION_LEFT = 8;
        EFFECT_DIRECTION_CENTER = 16;
        EFFECT_DIRECTION_RIGHT = 32;
        EFFECT_DIRECTION_BOTTOM_LEFT = 64;
        EFFECT_DIRECTION_BOTTOM = 128;
        EFFECT_DIRECTION_BOTTOM_RIGHT = 256;
      }

      rv.data.Effect.EffectVariable.EffectDirection.EffectDirection direction = 1;
      rv.data.Effect.EffectVariable.EffectDirection.EffectDirection default_direction = 2;
      uint32 available_directions = 3;
    }

    message EffectGrouping {
      enum EffectGrouping {
        EFFECT_GROUPING_INVALID = 0;
        EFFECT_GROUPING_CHARACTER = 1;
        EFFECT_GROUPING_WORD = 2;
        EFFECT_GROUPING_LINE = 4;
        EFFECT_GROUPING_ALL = 8;
      }

      rv.data.Effect.EffectVariable.EffectGrouping.EffectGrouping grouping = 1;
      rv.data.Effect.EffectVariable.EffectGrouping.EffectGrouping default_grouping = 2;
      uint32 available_groupings = 3;
    }

    message EffectMotion {
      enum EffectMotion {
        EFFECT_MOTION_INVALID = 0;
        EFFECT_MOTION_NONE = 1;
        EFFECT_MOTION_GROW = 2;
        EFFECT_MOTION_SHRINK = 4;
        EFFECT_MOTION_UP = 8;
        EFFECT_MOTION_DOWN = 16;
      }

      rv.data.Effect.EffectVariable.EffectMotion.EffectMotion motion = 1;
      rv.data.Effect.EffectVariable.EffectMotion.EffectMotion default_motion = 2;
      uint32 available_motions = 3;
    }

    message EffectMotionStyle {
      enum EffectMotionStyle {
        EFFECT_MOTION_STYLE_INVALID = 0;
        EFFECT_MOTION_STYLE_SUBTLE = 1;
        EFFECT_MOTION_STYLE_STANDARD = 2;
        EFFECT_MOTION_STYLE_DRAMATIC = 4;
      }

      rv.data.Effect.EffectVariable.EffectMotionStyle.EffectMotionStyle motion_style = 1;
      rv.data.Effect.EffectVariable.EffectMotionStyle.EffectMotionStyle default_motion_style = 2;
      uint32 available_motion_styles = 3;
    }

    oneof Type {
      rv.data.Effect.EffectVariable.EffectInt int = 3;
      rv.data.Effect.EffectVariable.EffectFloat float = 4;
      rv.data.Effect.EffectVariable.EffectColor color = 5;
      rv.data.Effect.EffectVariable.EffectDirection direction = 6;
      rv.data.Effect.EffectVariable.EffectDouble double = 7;
      rv.data.Effect.EffectVariable.EffectGrouping grouping = 8;
      rv.data.Effect.EffectVariable.EffectMotion motion = 9;
      rv.data.Effect.EffectVariable.EffectMotionStyle motion_style = 10;
    }

    string name = 1;
    string description = 2;
  }

  message Preset {
    rv.data.UUID uuid = 1;
    string name = 2;
    repeated rv.data.Effect effects = 3;
  }

  rv.data.UUID uuid = 1;
  bool enabled = 2;
  string name = 3;
  string render_id = 4;
  string behavior_description = 5;
  string category = 6;
  repeated rv.data.Effect.EffectVariable variables = 7;
}

message Transition {
  message TextAnimation {
    double duration = 1;
    rv.data.UUID favorite_uuid = 2;
    rv.data.Effect effect = 3;
  }

  message Preset {
    rv.data.UUID uuid = 1;
    string name = 2;
    rv.data.Transition transition = 3;
  }

  double duration = 1;
  rv.data.UUID favorite_uuid = 2;
  rv.data.Effect effect = 3;
  rv.data.Transition.TextAnimation text_animation = 4;
}
