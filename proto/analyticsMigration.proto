  LEGACY_WORKSPACE_MIGRATION_FAILED_KIND_PRESENTATION_PLAYLISTS = 7;
  LEGACY_WORKSPACE_MIGRATION_FAILED_KIND_MEDIA_PLAYLISTS = 8;
  LEGACY_WORKSPACE_MIGRATION_FAILED_KIND_AUDIO_PLAYLISTS = 9;
  LEGACY_WORKSPACE_MIGRATION_FAILED_KIND_PLAYLIST_TEMPLATES = 10;
  LEGACY_WORKSPACE_MIGRATION_FAILED_KIND_MACROS = 11;
  LEGACY_WORKSPACE_MIGRATION_FAILED_KIND_PROPS = 12;
  LEGACY_WORKSPACE_MIGRATION_FAILED_KIND_STAGE_LAYOUTS = 13;
  LEGACY_WORKSPACE_MIGRATION_FAILED_KIND_MESSAGES = 14;
  LEGACY_WORKSPACE_MIGRATION_FAILED_KIND_TIMERS = 15;
  LEGACY_WORKSPACE_MIGRATION_FAILED_KIND_CALENDAR = 16;
  LEGACY_WORKSPACE_MIGRATION_FAILED_KIND_KEYBOARD_SHORTCUTS = 17;
