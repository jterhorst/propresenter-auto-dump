syntax = "proto3";


package document;


enum Scope {
  SHARED = 0;
  DEVICE_LOCAL = 1;
}

message Ready {
  bytes data = 1;
}

message Remote {
}

message Stored {
}

message Local {
  uint64 timestamp = 1;
}

message Intrinsic {
  enum Kind {
    Calendar = 0;
    CCLI = 1;
    ClearGroups = 2;
    CommunicationDevices = 3;
    Groups = 4;
    KeyMappings = 5;
    Labels = 6;
    Macros = 7;
    Messages = 8;
    Props = 9;
    Stage = 10;
    Timers = 11;
    Workspace = 12;
    TestPatterns = 18;
    LibraryData = 13;
    PlaylistAudio = 14;
    PlaylistLibrary = 15;
    PlaylistMedia = 16;
    PlaylistTemplates = 17;
  }

  string uuid = 1;
  document.Intrinsic.Kind kind = 2;
  bytes body = 3;
}

message Document {
  enum Kind {
    PRESENTATION = 0;
    THEME = 1;
    EFFECT = 2;
    TRANSITION = 3;
  }

  oneof body {
    document.Ready ready = 10;
    document.Local local = 11;
    document.Remote remote = 12;
    document.Stored stored = 13;
  }

  string uuid = 1;
  string path = 2;
}

message DocumentSet {
  repeated document.Intrinsic intrinsics = 1;
  repeated document.Document presentations = 2;
  repeated document.Document themes = 3;
  repeated document.Document effects = 4;
  repeated document.Document transitions = 5;
}

message Workspace {
  string path = 1;
  optional string uuid = 2;
}
