syntax = "proto3";


package rv.analytics.import;


import "analyticsMultiTracks.proto";



message SongSelect {
  enum LineDelimiter {
    UNKNOWN = 0;
    LINE_BREAK = 1;
    PARAGRAPH_BREAK = 2;
  }

  int32 template_slide_text_element_count = 1;
  bool import_into_playlist = 2;
  rv.analytics.import.SongSelect.LineDelimiter line_delimiter = 3;
  int32 line_delimiter_count = 4;
  bool did_open_edit_view = 5;
  rv.analytics.multitracks.Import multitracks = 6;
}

message APlayServiceImport {
  enum Result {
    RESULT_UNSPECIFIED = 0;
    SUCCESS = 1;
    PARTIAL = 2;
    FAILED = 3;
  }

  rv.analytics.import.APlayServiceImport.Result result = 1;
  uint32 item_count = 2;
}

message APlayServiceRefresh {
  enum Result {
    RESULT_UNSPECIFIED = 0;
    SUCCESS = 1;
    FAILED = 2;
  }

  rv.analytics.import.APlayServiceRefresh.Result result = 1;
}
