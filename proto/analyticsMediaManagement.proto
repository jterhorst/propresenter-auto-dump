syntax = "proto3";


package rv.analytics.mediamanagement;


message InstallationComplete {
  message Success {
  }

  message Failure {
    string error = 1;
  }

  oneof state {
    rv.analytics.mediamanagement.InstallationComplete.Success success = 1;
    rv.analytics.mediamanagement.InstallationComplete.Failure failure = 2;
  }

}

message BootstrappingComplete {
  message Success {
  }

  message Failure {
    string error = 1;
  }

  oneof state {
    rv.analytics.mediamanagement.BootstrappingComplete.Success success = 1;
    rv.analytics.mediamanagement.BootstrappingComplete.Failure failure = 2;
  }

}

message MessageFailure {
  string error = 1;
}

message UnexpectedlyNotRunning {
}

message ConnectionChanged {
  enum State {
    STATE_CONNECTED = 0;
    STATE_DISCONNECTED = 1;
  }

  rv.analytics.mediamanagement.ConnectionChanged.State state = 1;
}

message AddedMediaReference {
  int32 width = 1;
  int32 height = 2;
}

message NotResponding {
}

message MediaStateResyncGaveUp {
  enum Source {
    SOURCE_RESYNC = 0;
    SOURCE_WORKSPACE_ACTIVATION = 1;
    SOURCE_RECONNECT_RETRY = 2;
  }

  rv.analytics.mediamanagement.MediaStateResyncGaveUp.Source source = 1;
}

message UnreadableMediaHeld {
  string workspace_identifier = 1;
  string hardware_id = 2;
  uint32 unknown_type = 3;
  uint32 missing_type = 4;
  uint32 suffixed_case = 5;
  uint32 respelled_case = 6;
  uint32 documents = 7;
}
