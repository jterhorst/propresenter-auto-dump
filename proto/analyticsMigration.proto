  CLASS_B_CUTOVER_SCOPE_UNSPECIFIED = 0;
  CLASS_B_CUTOVER_SCOPE_PLAYLIST_TREE = 1;
  CLASS_B_CUTOVER_SCOPE_PRESENTATION_PLACEMENT = 2;
  CLASS_B_CUTOVER_SCOPE_WORKSPACE = 3;
}

enum ClassBCutoverPath {
  CLASS_B_CUTOVER_PATH_UNSPECIFIED = 0;
  CLASS_B_CUTOVER_PATH_ACTIVATION = 1;
  CLASS_B_CUTOVER_PATH_LIVE_RETRY = 2;
}

enum ClassBCutoverOutcome {
  CLASS_B_CUTOVER_OUTCOME_UNSPECIFIED = 0;
  CLASS_B_CUTOVER_OUTCOME_WON = 1;
  CLASS_B_CUTOVER_OUTCOME_ADOPTED_AFTER_LOSS = 2;
