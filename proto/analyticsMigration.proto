  LEGACY_WORKSPACE_MIGRATION_STAGE_SYNC_ACTIVATION = 11;
  LEGACY_WORKSPACE_MIGRATION_STAGE_HYDRATION = 12;
}

enum LegacyWorkspaceMigrationFailedKind {
  LEGACY_WORKSPACE_MIGRATION_FAILED_KIND_UNSPECIFIED = 0;
  LEGACY_WORKSPACE_MIGRATION_FAILED_KIND_PRESENTATIONS = 1;
  LEGACY_WORKSPACE_MIGRATION_FAILED_KIND_THEMES = 2;
  LEGACY_WORKSPACE_MIGRATION_FAILED_KIND_EFFECTS_AND_TRANSITIONS = 3;
  LEGACY_WORKSPACE_MIGRATION_FAILED_KIND_MEDIA_FILES = 4;
  LEGACY_WORKSPACE_MIGRATION_FAILED_KIND_LIBRARIES = 5;
