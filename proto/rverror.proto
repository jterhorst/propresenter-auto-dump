syntax = "proto3";


package rverror;


message StackFrame {
  string method = 1;
  string file = 2;
  uint32 line = 3;
  uint64 instruction_address = 4;
}

message ReportedError {
  enum Severity {
    HANDLED = 0;
    FATAL = 1;
  }

  string description = 1;
  string type = 2;
  string file = 3;
  uint32 line = 4;
  rverror.ReportedError.Severity severity = 5;
  repeated rverror.StackFrame stack_frames = 6;
}
