syntax = "proto3";


package rv.analytics.sync;


enum WebSocketFailureReason {
  UNKNOWN = 0;
  AUTHENTICATION = 1;
  TIMEOUT = 2;
  NO_INTERNET = 3;
  SERVER_ERROR = 4;
}

message Local {
  enum Type {
    UP = 0;
    DOWN = 1;
  }

  rv.analytics.sync.Local.Type sync_type = 1;
  bool include_library = 2;
  bool include_media = 3;
  bool include_playlists = 4;
  bool include_themes = 5;
  bool include_support_files = 6;
  bool replace_files = 7;
}

message WebSocketConnectionFailed {
  rv.analytics.sync.WebSocketFailureReason reason = 1;
  string url = 2;
  string error_description = 3;
}

message DocumentSyncRateLimited {
  enum Phase {
    UNKNOWN = 0;
    STARTED = 1;
    ENDED = 2;
  }

  rv.analytics.sync.DocumentSyncRateLimited.Phase phase = 1;
  string workspace_identifier = 2;
  optional uint64 retry_after_seconds = 3;
  uint32 documents_held = 4;
  uint32 refusals = 5;
  uint64 duration_ms = 6;
}

message StoredVersionVectorRepaired {
  enum Kind {
    UNKNOWN = 0;
    VALUE_EQUAL = 1;
    VALUE_DIFFERENT = 2;
    UNDECODABLE = 3;
  }

  rv.analytics.sync.StoredVersionVectorRepaired.Kind kind = 1;
  string document_identifier = 2;
  uint32 stored_peer_count = 3;
  uint32 computed_peer_count = 4;
  string architecture = 5;
  string hardware_id = 6;
  uint32 repairs_in_open = 7;
}
