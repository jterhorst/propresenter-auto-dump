  CLASS_B_CUTOVER_FAILURE_KIND_RELAY_REFUSED = 3;
  CLASS_B_CUTOVER_FAILURE_KIND_RELAY_MALFORMED = 4;
  CLASS_B_CUTOVER_FAILURE_KIND_SNAPSHOT = 5;
