  CLASS_B_CUTOVER_FAILURE_KIND_STORE_MOVED = 8;
  CLASS_B_CUTOVER_FAILURE_KIND_TASK = 9;
  CLASS_B_CUTOVER_FAILURE_KIND_OTHER = 10;
}

enum BoundaryAbsence {
  BOUNDARY_ABSENCE_NONE = 0;
  BOUNDARY_ABSENCE_NEVER_RECORDED = 1;
  BOUNDARY_ABSENCE_CUTOVER_CLEARED = 2;
  BOUNDARY_ABSENCE_NEVER_SHARED = 3;
  BOUNDARY_ABSENCE_LOST = 4;
}

enum UnbasedReason {
  UNBASED_REASON_NONE = 0;
  UNBASED_REASON_NO_BOUNDARY_AND_BEHIND_HEAD = 1;
  UNBASED_REASON_REPLICA_PRESENTED_NO_TREE = 2;
