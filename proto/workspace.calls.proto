syntax = "proto3";


package workspace.call;


import "workspace.bootstrap.proto";

import "workspace.entities.local.proto";

import "workspace.entities.remote.proto";



enum PersistenceAuthority {
  CLIENT = 0;
  CORE = 1;
}

message Error {
  enum Code {
    UNKNOWN = 0;
    CANCELLED = 1;
    RESTORED = 2;
    INSUFFICIENT_DISK_SPACE = 3;
    REGISTRY_UNREADABLE = 4;
    COMMITTED_REPAIR_REQUIRED = 5;
    SYNC_PAUSED = 6;
    MEDIA_PROJECTION_SUSPENDED = 7;
    SYNC_BLOCKED = 8;
    WORKSPACE_ORGANIZATION_MISMATCH = 9;
    WORKSPACE_ACCESS_DENIED = 10;
    WORKSPACE_SIGNED_OUT = 11;
    UNMANAGED_MEDIA_REMAINS = 12;
    ALREADY_DOWNLOADED = 13;
    SMART_PLAYLISTS_NOT_RESTORED = 14;
    CLOUD_TERMINATED = 15;
  }

  workspace.call.Error.Code code = 1;
  string description = 2;
  optional uint64 required_bytes = 3;
  optional uint64 available_bytes = 4;
  repeated string unmanaged_media_paths = 5;
  optional string registered_local_uuid = 6;
  optional uint32 http_status = 7;
}

message OpenLocal {
  message Result {
    message Ok {
      workspace.call.PersistenceAuthority persistence_authority = 1;
      string local_uuid = 2;
      string root_path = 3;
    }

    oneof result {
      workspace.call.OpenLocal.Result.Ok ok = 1;
      workspace.call.Error error = 2;
    }

  }

  workspace.local.Workspace workspace = 1;
  workspace.call.PersistenceAuthority persistence_authority = 2;
}

message OpenRemote {
  message Result {
    message Ok {
      workspace.remote.Workspace workspace = 1;
      workspace.call.PersistenceAuthority persistence_authority = 2;
      string local_uuid = 3;
      string root_path = 4;
    }

    oneof result {
      workspace.call.OpenRemote.Result.Ok ok = 1;
      workspace.call.Error error = 2;
    }

  }

  string cloud_uuid = 1;
  string path = 2;
  workspace.call.PersistenceAuthority persistence_authority = 3;
  string operation_uuid = 4;
  string local_uuid = 5;
}

message CancelOpenRemote {
  string operation_uuid = 1;
}

message CancelImport {
  string operation_uuid = 1;
}

message ArchiveDocumentData {
  message Result {
    message Ok {
      string database_path = 1;
    }

    oneof result {
      workspace.call.ArchiveDocumentData.Result.Ok ok = 1;
      workspace.call.Error error = 2;
    }

  }

  string destination_directory = 1;
  string expected_local_uuid = 2;
  uint64 expected_generation = 3;
}

message ExportMigrationRecovery {
  message Result {
    message Ok {
      string directory_path = 1;
      string manifest_path = 2;
      uint64 item_count = 3;
    }

    oneof result {
      workspace.call.ExportMigrationRecovery.Result.Ok ok = 1;
      workspace.call.Error error = 2;
    }

  }

  string destination_directory = 1;
  string expected_local_uuid = 2;
  uint64 expected_generation = 3;
}

message ExportLegacyWorkspace {
  enum MissingMediaPolicy {
    MISSING_MEDIA_POLICY_PRESERVE_AND_REPORT = 0;
    MISSING_MEDIA_POLICY_REFUSE = 1;
  }

  enum BundleKind {
    BUNDLE_KIND_UNSPECIFIED = 0;
    BUNDLE_KIND_PRESENTATION = 1;
    BUNDLE_KIND_THEME = 2;
  }

  message Result {
    message Ok {
      string target_path = 1;
      string manifest_path = 2;
      uint64 document_count = 3;
      uint64 media_file_count = 4;
      uint64 compatibility_warning_count = 5;
      uint64 elapsed_millis = 6;
    }

    oneof result {
      workspace.call.ExportLegacyWorkspace.Result.Ok ok = 1;
      workspace.call.Error error = 2;
    }

  }

  string target_path = 1;
  repeated string document_uuids = 2;
  workspace.call.ExportLegacyWorkspace.BundleKind bundle_kind = 3;
  workspace.call.ExportLegacyWorkspace.MissingMediaPolicy missing_media_policy = 4;
}

message ImportLegacyWorkspace {
  message Result {
    message Failure {
      enum Severity {
        SEVERITY_UNSPECIFIED = 0;
        SEVERITY_WARNING = 1;
        SEVERITY_ERROR = 2;
      }

      enum Kind {
        KIND_UNSPECIFIED = 0;
        KIND_SYMBOLIC_LINK = 1;
        KIND_SPECIAL_FILE = 2;
        KIND_ESCAPES_WORKSPACE = 3;
        KIND_UNSUPPORTED_FILE = 4;
        KIND_HASH_FAILED = 5;
        KIND_CHANGED_DURING_HASH = 6;
        KIND_ABANDONED_PENDING_SNAPSHOT = 7;
        KIND_ABANDONED_DELETION_TOMBSTONE = 8;
        KIND_INVALID_SNAPSHOT_PATH = 9;
        KIND_INVALID_SNAPSHOT = 10;
        KIND_EMPTY_DEVICE_LOCAL_SNAPSHOT = 11;
        KIND_EQUIVALENT_COMPATIBILITY_ALIAS = 12;
        KIND_CONFLICTING_DUPLICATE_STREAM = 13;
        KIND_CONFLICTING_DOCUMENT_PATH = 14;
        KIND_CONFLICTING_INTRINSIC_KIND = 15;
        KIND_MISSING_SHARED_COUNTERPART = 16;
        KIND_MISSING_INTRINSIC = 17;
        KIND_SOURCE_CHANGED = 18;
        KIND_MISSING_SOURCE_DIGEST = 19;
        KIND_UNSUPPORTED = 20;
        KIND_HISTORICAL_MIGRATION = 21;
        KIND_TARGET_EXISTS = 22;
        KIND_TARGET_INSIDE_SOURCE = 23;
        KIND_ACTIVE_TARGET = 24;
        KIND_INVALID_TARGET = 25;
        KIND_IO = 26;
        KIND_CASE_INSENSITIVE_PATH_AMBIGUITY = 27;
        KIND_INSUFFICIENT_DISK_SPACE = 28;
        KIND_CONVERSION = 29;
      }

      enum Phase {
        PHASE_UNSPECIFIED = 0;
        PHASE_INVENTORY = 1;
        PHASE_DOCUMENTS = 2;
        PHASE_MEDIA = 3;
        PHASE_VALIDATION = 4;
        PHASE_PUBLICATION = 5;
      }

      message Diagnostic {
        workspace.call.ImportLegacyWorkspace.Result.Failure.Severity severity = 1;
        workspace.call.ImportLegacyWorkspace.Result.Failure.Kind kind = 2;
        optional string path = 3;
        string description = 4;
      }

      workspace.call.Error summary = 1;
      repeated workspace.call.ImportLegacyWorkspace.Result.Failure.Diagnostic diagnostics = 2;
      optional string staged_diagnostics_path = 3;
      bool source_untouched = 4;
      optional workspace.call.ImportLegacyWorkspace.Result.Failure.Phase phase = 5;
    }

    message Ok {
      string target_path = 1;
      string manifest_path = 2;
      uint64 document_stream_count = 3;
      uint64 media_file_count = 4;
      uint64 elapsed_millis = 5;
      repeated workspace.call.ImportLegacyWorkspace.Result.Failure.Diagnostic diagnostics = 6;
    }

    oneof result {
      workspace.call.ImportLegacyWorkspace.Result.Ok ok = 1;
      workspace.call.Error error = 2;
    }

    workspace.call.ImportLegacyWorkspace.Result.Failure failure = 3;
  }

  string source_path = 1;
  string target_path = 2;
  string local_uuid = 3;
  optional string historical_helper_path = 4;
  optional string historical_ssapi_resources_path = 5;
  optional string historical_xsl_directory_path = 6;
  optional string historical_framework_directory_path = 7;
  optional bool pco_theme_dark = 8;
  optional string display_name = 9;
  optional string supersedes_workspace_uuid = 10;
}

message ImportLegacyDocument {
  message Result {
    message Ok {
      string uuid = 1;
      uint64 generation = 2;
      bytes durable_version_vector = 3;
      uint64 imported_media_count = 4;
      uint64 unresolved_media_count = 5;
      string path = 6;
      uint64 catalog_revision = 7;
    }

    oneof result {
      workspace.call.ImportLegacyDocument.Result.Ok ok = 1;
      workspace.call.Error error = 2;
    }

  }

  string source_path = 1;
  string expected_uuid = 2;
  string path = 3;
  uint64 generation = 4;
  string operation_uuid = 5;
  optional string media_source_root = 6;
}

message ImportLegacyBundle {
  message Result {
    message ImportedDocument {
      string uuid = 1;
      string operation_uuid = 2;
      string path = 3;
      uint64 generation = 4;
      bytes durable_version_vector = 5;
      uint64 imported_media_count = 6;
      uint64 unresolved_media_count = 7;
    }

    message Ok {
      repeated workspace.call.ImportLegacyBundle.Result.ImportedDocument documents = 1;
      bool events_published = 2;
      uint64 catalog_revision = 3;
    }

    oneof result {
      workspace.call.ImportLegacyBundle.Result.Ok ok = 1;
      workspace.call.Error error = 2;
    }

  }

  string source_path = 1;
  string destination_path = 2;
  uint64 generation = 3;
  string operation_uuid = 4;
}

message InstallBundledThemes {
  message Result {
    message Failure {
      string folder = 1;
      string reason = 2;
    }

    message Ok {
      repeated string installed = 1;
      repeated string already_present = 2;
      repeated workspace.call.InstallBundledThemes.Result.Failure failed = 3;
      uint32 rollout_sequence = 4;
    }

    oneof result {
      workspace.call.InstallBundledThemes.Result.Ok ok = 1;
      workspace.call.Error error = 2;
    }

  }

  string bundled_themes_path = 1;
  uint64 generation = 2;
  bool include_baseline = 3;
}

message ConvertLegacyPlaylist {
  message Result {
    message Ok {
    }

    oneof result {
      workspace.call.ConvertLegacyPlaylist.Result.Ok ok = 1;
      workspace.call.Error error = 2;
    }

  }

  string source_path = 1;
  string target_path = 2;
}

message AttachLegacyPlaylistMedia {
  message Result {
    message Ok {
      uint64 generation = 1;
      bytes durable_version_vector = 2;
      uint64 imported_media_count = 3;
      uint64 unresolved_media_count = 4;
    }

    oneof result {
      workspace.call.AttachLegacyPlaylistMedia.Result.Ok ok = 1;
      workspace.call.Error error = 2;
